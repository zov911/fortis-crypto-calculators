<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed Demo – Fortis Calculators</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1b1b1b}
.site-head{position:sticky;top:0;z-index:5;height:64px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 24px;font-weight:700}
.site-head nav{margin-left:auto;display:flex;gap:18px;font-weight:500}
.site-head a{color:inherit}
main{max-width:1240px;margin:0 auto;padding:24px 16px 80px}
h2{margin:40px 0 12px;font-size:20px}
p.note{color:#666;font-size:14px}
</style>
</head>
<body>
<header class="site-head">Example host website <nav><a href="#cost">Cost</a><a href="#readiness">Readiness</a><a href="#savings">Savings</a></nav></header>
<main>
  <p class="note">This page simulates a client website embedding the calculators with <code>embed.js</code>. Each calculator below is an auto-resizing iframe.</p>
  <h2 id="cost">Cost calculator</h2>
  <div data-fortis-calculator="cost" data-scroll-offset="72"></div>
  <h2 id="readiness">Readiness scorecard</h2>
  <div data-fortis-calculator="readiness" data-scroll-offset="72"></div>
  <h2 id="savings">Savings calculator</h2>
  <div data-fortis-calculator="savings" data-scroll-offset="72"></div>
</main>
<script src="../embed.js" async></script>
</body>
</html>
